name: Build Astral Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select newest Xcode
        shell: bash
        run: |
          set -e
          ls /Applications/ | grep -i xcode
          SELECTED=$(ls /Applications/ | grep -i '^Xcode' | sort -V | tail -1)
          echo "Using $SELECTED"
          sudo xcode-select -s "/Applications/$SELECTED.app" || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Astral.xcodeproj
        run: xcodegen generate

      - name: Build Unsigned IPA (Release, all arm64 sim+device slices not needed)
        run: |
          xcodebuild \
            -project Astral.xcodeproj \
            -scheme Astral \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package Astral.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Astral.app Payload/
          zip -r -9 Astral-Unsigned.ipa Payload
          ls -lh Astral-Unsigned.ipa

      - name: Upload Astral.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astral-Unsigned-IPA
          path: Astral-Unsigned.ipa

      - name: Release IPA to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Astral Build ${{ github.run_number }}
          body: |
            Astral — بيئة تطوير iOS مجانية لـ Google Antigravity

            IPA غير موقّع — يوقَّع ويُثبَّت عبر ESign / Feather / AltStore / SideStore / TrollStore.
            Unsigned IPA — sign & install via ESign / Feather / AltStore / SideStore / TrollStore.
          files: Astral-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

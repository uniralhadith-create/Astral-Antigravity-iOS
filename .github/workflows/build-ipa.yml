name: Build Astral Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Astral.xcodeproj
        run: xcodegen generate

      - name: Build Unsigned Archive
        run: |
          xcodebuild \
            -project Astral.xcodeproj \
            -scheme Astral \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package Astral.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Astral.app Payload/
          zip -r -9 Astral-Unsigned.ipa Payload
          ls -lh Astral-Unsigned.ipa

      - name: Upload Astral.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astral-Unsigned-IPA
          path: Astral-Unsigned.ipa
